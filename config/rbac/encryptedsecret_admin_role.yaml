# This rule is not used by the project encrypted-secret-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over security.copsds.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: encrypted-secret-operator
    app.kubernetes.io/managed-by: kustomize
  name: encryptedsecret-admin-role
rules:
- apiGroups:
  - security.copsds.com
  resources:
  - encryptedsecrets
  verbs:
  - '*'
- apiGroups:
  - security.copsds.com
  resources:
  - encryptedsecrets/status
  verbs:
  - get
